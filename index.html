<body>
  <div class="shell">
    <header class="top">
      <div>
        <div class="eyebrow">FAMILY CHECKLIST</div>
        <h1>우리 가족 체크리스트</h1>

      <div id="userbox"></div>

  <div id="toast" role="status" aria-live="polite"></div>
